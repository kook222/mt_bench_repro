name: Validate research artifact

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python3 -m compileall -q src scripts

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -v

      - name: Validate release contents
        run: python3 scripts/tools/verify_release.py

      - name: Regenerate committed paper artifacts
        run: |
          python3 scripts/analysis/build_paper_artifacts.py --no-figure
          git diff --exit-code -- data/
          test -z "$(git status --porcelain --untracked-files=all -- data/)"
          python3 scripts/tools/verify_release.py
